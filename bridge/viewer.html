<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Puente espectador</title>
<style>:root{color-scheme:dark}body{font:16px system-ui;background:#111;color:#eee;margin:16px}button,input{font-size:18px;padding:10px 12px}pre{background:#000;padding:8px;white-space:pre-wrap}
#pad{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;margin-top:12px;user-select:none;-webkit-user-select:none;touch-action:none}
.pb{font:600 18px system-ui;color:#fff;border:0;border-radius:14px;padding:0;touch-action:none;-webkit-tap-highlight-color:transparent}
.pb.on{filter:brightness(1.6);transform:scale(.95)}
.col{display:flex;flex-direction:column;gap:10px;align-items:center}.row{display:flex;gap:8px;width:100%}
.trig{flex:1;height:64px}
.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);gap:4px}
.d.up{grid-area:1/2}.d.lf{grid-area:2/1}.d.rg{grid-area:2/3}.d.dn{grid-area:3/2}
.mid{display:flex;flex-direction:column;gap:10px;justify-content:center}.small{height:54px;width:84px}
.stick{position:relative;width:160px;height:160px;border-radius:50%;background:#2a2a32;border:2px solid #555;touch-action:none;display:flex;align-items:center;justify-content:center}
.stick span{position:absolute;bottom:8px;font-size:12px;color:#aaa;pointer-events:none}
.knob{width:64px;height:64px;border-radius:50%;background:#888;pointer-events:none}
.face{display:grid;grid-template-columns:repeat(2,64px);gap:6px}.f{height:56px}
@media(max-width:560px){#pad{gap:8px;grid-template-columns:auto auto auto;justify-content:space-between}.dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:3px}.stick{width:112px;height:112px}.knob{width:48px;height:48px}.face{grid-template-columns:repeat(2,48px);gap:4px}.f{height:42px;font-size:16px}.trig{height:48px;min-width:0;font-size:16px}.small{width:58px;height:44px;font-size:13px}.row{gap:4px}.pb{border-radius:10px}}
</style>
<h2>Espectador</h2>
<input id="sala" placeholder="Código de sala" autocomplete="off"> <button id="c">Conectar</button> <span>demora: <b id="rtt">-</b></span>
<video id="v" autoplay playsinline controls style="max-width:100%;display:block;margin-top:12px"></video>
<div id="pad"></div>
<pre id="log"></pre>
<script type="module" src="viewer.js"></script></html>
